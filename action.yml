# =============================================================================
# QCentriQ Test Run — GitHub Action
#
# Triggers a QCentriQ test suite, waits for the verdict, and fails the step when
# tests fail so branch protection can gate the merge.
#
# Self-contained: talks to the QCentriQ API with curl + jq (both preinstalled on
# GitHub-hosted runners). Nothing is downloaded at run time and no CLI is
# required. `actions/checkout` is NOT needed — QCentriQ never reads the
# repository; test definitions live in QCentriQ and execute on its own runners.
#
# Exit codes: 0 passed · 1 test failure · 2 run error · 3 action/transport error
# =============================================================================
name: 'QCentriQ Test Run'
description: 'Trigger a QCentriQ test suite, report results, and gate the pull request'
author: 'QCentriQ'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  api-url:
    description: 'Base URL of your QCentriQ instance, e.g. https://qcentriq.example.com'
    required: true
  api-token:
    description: 'QCentriQ project-scoped API key. Always pass via secrets.'
    required: true
  project-id:
    description: 'UUID of the QCentriQ project'
    required: true
  app-url:
    description: |
      Base URL of the QCentriQ web app, e.g. https://app.qcentriq.com. When
      set, the summary, PR comment and log link straight to the run in the
      app. Often a different host from api-url.
    required: false
    default: ''
  test-group-id:
    description: 'UUID of the test group to run. Mutually exclusive with test-case-id.'
    required: false
    default: ''
  test-case-id:
    description: 'UUID of a single test case to run. Mutually exclusive with test-group-id.'
    required: false
    default: ''
  environment-id:
    description: 'UUID of the QCentriQ environment to run against. Defaults to the project setting.'
    required: false
    default: ''
  browser-id:
    description: 'UUID of the browser to run on. Defaults to the project setting.'
    required: false
    default: ''
  env-vars:
    description: |
      KEY=VALUE pairs, one per line, overriding the QCentriQ-configured
      environment values. CI wins on collision. The value may itself contain
      "=" (base64, JWTs) — only the first "=" separates key from value.
      Server limits: at most 50 keys and 4096 bytes serialized.
    required: false
    default: ''
  poll-interval:
    description: 'Seconds between status polls. The API allows 60 requests/minute.'
    required: false
    default: '5'
  timeout:
    description: 'Maximum seconds to wait for the run to reach a terminal status'
    required: false
    default: '3600'
  fail-on-test-failure:
    description: 'Fail the step when tests fail. Set to false to report without gating.'
    required: false
    default: 'true'
  upload-log:
    description: 'Upload run.log as a workflow artifact'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Post a sticky summary comment on the pull request'
    required: false
    default: 'true'

outputs:
  run-id:
    description: 'UUID of the QCentriQ run'
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: 'Terminal run status: passed, failed or error'
    value: ${{ steps.run.outputs.status }}
  total:
    description: 'Total number of test cases executed'
    value: ${{ steps.run.outputs.total }}
  passed:
    description: 'Number of test cases that passed'
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: 'Number of test cases that failed'
    value: ${{ steps.run.outputs.failed }}
  target-name:
    description: 'Title of the test group or test case that was run, when resolvable'
    value: ${{ steps.run.outputs.target-name }}
  run-url:
    description: 'Link to the run in the QCentriQ web app (empty unless app-url is set)'
    value: ${{ steps.run.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: Run QCentriQ suite
      id: run
      shell: bash
      env:
        # Secrets travel by environment, never argv: argv is world-readable
        # through `ps` on a shared runner.
        QC_TOKEN: ${{ inputs.api-token }}
        QC_URL: ${{ inputs.api-url }}
        APP_URL: ${{ inputs.app-url }}
        PROJECT_ID: ${{ inputs.project-id }}
        GROUP_ID: ${{ inputs.test-group-id }}
        CASE_ID: ${{ inputs.test-case-id }}
        ENV_ID: ${{ inputs.environment-id }}
        BROWSER_ID: ${{ inputs.browser-id }}
        ENV_VARS: ${{ inputs.env-vars }}
        POLL: ${{ inputs.poll-interval }}
        RUN_TIMEOUT: ${{ inputs.timeout }}
        FAIL_ON_FAILURE: ${{ inputs.fail-on-test-failure }}
      run: |
        # GitHub invokes `shell: bash` with -e already on. Clear it: this
        # action's exit codes are its contract and must be set deliberately,
        # not inherited from whichever command happened to fail first.
        set +e
        set -uo pipefail

        echo "::add-mask::$QC_TOKEN"
        api="${QC_URL%/}"

        for tool in curl jq; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "::error::$tool is required but not installed on this runner"
            exit 3
          }
        done

        # Validate the target here rather than inside jq: a jq runtime error
        # exits 5, which would surface as an opaque failure instead of this
        # message.
        if [ -n "$GROUP_ID" ] && [ -n "$CASE_ID" ]; then
          echo "::error::Set only one of test-group-id or test-case-id, not both"
          exit 3
        fi
        if [ -z "$GROUP_ID" ] && [ -z "$CASE_ID" ]; then
          echo "::error::Set either test-group-id or test-case-id"
          exit 3
        fi

        echo "QCentriQ: api=$api project=$PROJECT_ID target=${GROUP_ID:-$CASE_ID} ($(jq --version))"

        # ---- request body --------------------------------------------------
        # env-vars splits on the FIRST "=" only, so values containing "="
        # (base64, JWTs) survive intact.
        body=$(jq -n \
          --arg group "$GROUP_ID" \
          --arg case "$CASE_ID" \
          --arg env "$ENV_ID" \
          --arg browser "$BROWSER_ID" \
          --arg envvars "$ENV_VARS" '
          (if $group != "" then {test_group_id: $group} else {test_case_id: $case} end)
          + (if $env     != "" then {environment_id: $env}    else {} end)
          + (if $browser != "" then {browser_id: $browser}    else {} end)
          + (if $envvars != "" then
               {environment_variables:
                 ( $envvars
                   | split("\n")
                   | map(select(length > 0 and (test("^[[:space:]]*$") | not)))
                   | map(split("=") | {key: (.[0] | gsub("^[[:space:]]+|[[:space:]]+$"; "")),
                                       value: (.[1:] | join("="))})
                   | from_entries )}
             else {} end)')
        if [ $? -ne 0 ] || [ -z "$body" ]; then
          echo "::error::Could not build the request body — check the env-vars input format (KEY=VALUE, one per line)"
          exit 3
        fi

        # ---- trigger -------------------------------------------------------
        resp=$(curl -sS -X POST "$api/api/v1/integration/runs" \
          -H "X-API-Key: $QC_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "$body" \
          -w '\n%{http_code}') || {
          echo "::error::Could not reach $api — network error or wrong api-url"
          exit 3
        }
        code=$(tail -n1 <<<"$resp")
        json=$(sed '$d' <<<"$resp")

        if [ "$code" != "202" ]; then
          detail=$(jq -r '.detail // empty' <<<"$json" 2>/dev/null)
          echo "::error::Trigger failed (HTTP $code): ${detail:-$json}"
          exit 3
        fi

        run_id=$(jq -r '.run_id // empty' <<<"$json" 2>/dev/null)
        if [ -z "$run_id" ]; then
          echo "::error::Trigger returned HTTP $code but no run_id. Response: $json"
          exit 3
        fi
        # Resolve a human name for what we are running. The run API returns
        # only ids, so ask the discovery endpoint once. Entirely optional —
        # any failure just leaves the name blank.
        target_name=''
        info=$(curl -sS -m 30 "$api/api/v1/integration/info" \
                 -H "X-API-Key: $QC_TOKEN" 2>/dev/null) || info=''
        if [ -n "$info" ]; then
          if [ -n "$GROUP_ID" ]; then
            target_name=$(jq -r --arg id "$GROUP_ID" \
              '.test_groups[]? | select(.id == $id) | .title // empty' \
              <<<"$info" 2>/dev/null | head -1)
          else
            target_name=$(jq -r --arg id "$CASE_ID" \
              '.test_groups[]?.test_cases[]? | select(.id == $id) | .title // empty' \
              <<<"$info" 2>/dev/null | head -1)
          fi
        fi

        # Link to the run in the web app. Group runs open on the group-detail
        # page, single-case runs on the plain run page — the same choice the
        # app's own run list makes.
        run_url=''
        if [ -n "$APP_URL" ]; then
          run_url="${APP_URL%/}/projects/$PROJECT_ID/test-runs/$run_id"
          [ -n "$GROUP_ID" ] && run_url="$run_url/group-detail"
        fi

        if [ -n "$target_name" ]; then
          echo "QCentriQ: running \"$target_name\" (run $run_id)"
        else
          echo "QCentriQ run $run_id triggered for project $PROJECT_ID"
        fi

        # ---- poll to a terminal status -------------------------------------
        deadline=$(( SECONDS + RUN_TIMEOUT ))
        last=''
        status='unknown'
        while :; do
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::Timed out after ${RUN_TIMEOUT}s waiting for run $run_id"
            exit 3
          fi

          # A single failed poll must not kill the job — the run is still going.
          resp=$(curl -sS "$api/api/v1/integration/runs/$run_id" \
            -H "X-API-Key: $QC_TOKEN" -w '\n%{http_code}') || {
            sleep "$POLL"; continue
          }
          code=$(tail -n1 <<<"$resp")
          json=$(sed '$d' <<<"$resp")
          [ "$code" = "200" ] || { sleep "$POLL"; continue; }

          status=$(jq -r '.status // "unknown"' <<<"$json")
          if [ "$status" != "$last" ]; then
            echo "Run $run_id: $status"
            last="$status"
          fi

          case "$status" in
            passed|failed|error) break ;;
          esac
          sleep "$POLL"
        done

        # ---- outputs -------------------------------------------------------
        total=$(jq -r '.summary.total  // 0' <<<"$json")
        passed=$(jq -r '.summary.passed // 0' <<<"$json")
        failed=$(jq -r '.summary.failed // 0' <<<"$json")

        {
          echo "run-id=$run_id"
          echo "status=$status"
          echo "total=$total"
          echo "passed=$passed"
          echo "failed=$failed"
          echo "target-name=$target_name"
          echo "run-url=$run_url"
        } >> "$GITHUB_OUTPUT"

        # Print the results in the log too, so nobody needs an extra step to
        # see them.
        echo
        echo "──── QCentriQ results ────"
        [ -n "$target_name" ] && echo "target : $target_name"
        echo "status : $status"
        echo "total  : $total"
        echo "passed : $passed"
        echo "failed : $failed"
        echo "run-id : $run_id"
        [ -n "$run_url" ] && echo "view   : $run_url"
        echo "──────────────────────────"

        # ---- clean the captured output --------------------------------------
        # Runner output arrives with ANSI colour codes from pytest/structlog.
        # Rendered raw they show up as "\033[32m[1minfo" noise, so strip escape
        # sequences and stray CRs before any of it is displayed.
        strip_ansi() {
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\x1b[()][A-Z0-9]//g' \
              -e 's/\r$//' -e 's/\x1b//g'
        }

        # Per-failure detail, newline-separated so later loops can iterate ids.
        failed_idx=$(jq -r '[.logs[]? | select(.status == "failed")] | to_entries[] | .key' <<<"$json")

        detail_for() {   # $1 = index into the failed list
          jq -r --argjson i "$1" \
            '[.logs[]? | select(.status == "failed")][$i]
             | (.error_message // .logs // "No message recorded")' <<<"$json" | strip_ansi
        }
        title_for() {
          jq -r --argjson i "$1" \
            '[.logs[]? | select(.status == "failed")][$i].test_case_title // "Test"' <<<"$json"
        }

        # ---- run.log artifact -----------------------------------------------
        # Full, untruncated output — this is the record when the summary is
        # only showing a tail.
        {
          echo "=== QCentriQ run $run_id — $status ==="
          echo
          jq -r '.logs[]?
            | "Test:   \(.test_case_title // "Unknown")\nStatus: \(.status // "unknown")"
              + (if .error_message then "\nError:\n\(.error_message)" else "" end)
              + (if .logs then "\nLogs:\n\(.logs)" else "" end)
              + "\n" + ("-" * 72)' <<<"$json" | strip_ansi
        } > run.log

        # ---- one inline annotation per failed case --------------------------
        # Annotations are a one-line surface: GitHub truncates them and renders
        # them in a tooltip, so send the assertion rather than the whole log.
        # pytest marks assertion detail with a leading "E "; fall back to the
        # last few meaningful lines when that is absent.
        for i in $failed_idx; do
          t=$(title_for "$i")
          d=$(detail_for "$i")

          short=$(printf '%s\n' "$d" | grep -E '^[[:space:]]*E[[:space:]]' | head -8)
          [ -n "$short" ] || short=$(printf '%s\n' "$d" | grep -vE '^[[:space:]]*$' | tail -4)
          [ -n "$short" ] || short="Test failed"
          short=$(printf '%s' "$short" | head -c 900)

          # "%" first: escaping it later would mangle the escapes themselves.
          # Property values (title) also need ":" and "," which are structural.
          esc() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/%0A$//'; }
          escprop() { esc "$1" | sed -e 's/:/%3A/g' -e 's/,/%2C/g'; }
          echo "::error title=$(escprop "$t")::$(esc "$short")"
        done

        # ---- job summary ----------------------------------------------------
        # Lead with what a person needs to know: how many failed, and which
        # ones. The run id is bookkeeping, so it goes in the footer.
        plural=''; [ "$total" = "1" ] || plural='s'
        if [ -n "$target_name" ]; then
          case "$status" in
            passed) heading="✅ $target_name — all $total test$plural passed" ;;
            failed) heading="❌ $target_name — $failed of $total test$plural failed" ;;
            *)      heading="⚠️ $target_name — run did not complete ($status)" ;;
          esac
        else
          case "$status" in
            passed) heading="✅ All $total test$plural passed" ;;
            failed) heading="❌ $failed of $total test$plural failed" ;;
            *)      heading="⚠️ Run did not complete — $status" ;;
          esac
        fi

        fence='```'
        MAX_LINES=60
        {
          echo "## $heading"
          echo
          if [ -n "$run_url" ]; then
            echo "[**View this run in QCentriQ →**]($run_url)"
            echo
          fi
          if [ "$total" != "0" ]; then
            echo '| | Test case |'
            echo '|:-:|---|'
            # Failures first, so they are visible without scrolling. A "|" in a
            # title would break the table, so send it as an HTML entity.
            jq -r '(.logs[]? | select(.status == "failed")),
                   (.logs[]? | select(.status != "failed"))
                   | "| \(if .status == "passed" then "✅"
                          elif .status == "failed" then "❌"
                          else "⚠️" end) | \((.test_case_title // "Unnamed test")
                          | gsub("\\|"; "&#124;")) |"' <<<"$json"
          fi

          for i in $failed_idx; do
            t=$(title_for "$i")
            d=$(detail_for "$i")
            n=$(printf '%s\n' "$d" | wc -l)

            echo
            echo "<details><summary>❌ $t</summary>"
            echo
            echo "${fence}text"
            if [ "$n" -gt "$MAX_LINES" ]; then
              printf '%s\n' "$d" | tail -n "$MAX_LINES"
            else
              printf '%s\n' "$d"
            fi
            echo "$fence"
            if [ "$n" -gt "$MAX_LINES" ]; then
              echo
              echo "_Showing the last $MAX_LINES of $n lines — full output in the \`run.log\` artifact._"
            fi
            echo
            echo '</details>'
          done

          echo
          echo "<sub>QCentriQ run \`$run_id\`</sub>"
        } >> "$GITHUB_STEP_SUMMARY"

        # ---- exit code is the gate ------------------------------------------
        case "$status" in
          passed) exit 0 ;;
          failed) [ "$FAIL_ON_FAILURE" = 'true' ] && exit 1 || exit 0 ;;
          *)      echo "::error::Run $run_id ended with status '$status'"; exit 2 ;;
        esac

    - name: Upload run log
      if: always() && inputs.upload-log == 'true' && hashFiles('run.log') != ''
      uses: actions/upload-artifact@v4
      with:
        name: qcentriq-run-log-${{ steps.run.outputs.run-id }}
        path: run.log
        retention-days: 30

    - name: Comment on pull request
      if: always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        STATUS: ${{ steps.run.outputs.status }}
        TOTAL: ${{ steps.run.outputs.total }}
        PASSED: ${{ steps.run.outputs.passed }}
        FAILED: ${{ steps.run.outputs.failed }}
        RUN_ID: ${{ steps.run.outputs.run-id }}
        TARGET_NAME: ${{ steps.run.outputs.target-name }}
        RUN_URL: ${{ steps.run.outputs.run-url }}
      run: |
        set -uo pipefail
        [ -n "${STATUS:-}" ] || exit 0   # run step failed before reporting

        case "$STATUS" in
          passed) icon='✅' ;;
          failed) icon='❌' ;;
          *)      icon='⚠️' ;;
        esac
        label="QCentriQ"
        [ -n "${TARGET_NAME:-}" ] && label="QCentriQ · $TARGET_NAME"
        body="$icon **$label** — ${PASSED:-0}/${TOTAL:-0} passed, ${FAILED:-0} failed"
        [ -n "${RUN_URL:-}" ] && body="$body · [View run]($RUN_URL)"

        # Sticky: edit the previous comment instead of stacking one per push.
        gh pr comment "$PR_NUMBER" --edit-last --body "$body" 2>/dev/null \
          || gh pr comment "$PR_NUMBER" --body "$body" \
          || echo "::warning::Could not post PR comment (needs pull-requests: write)"
